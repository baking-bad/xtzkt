name: xtzkt

x-db: &db
  Db__ConnectionString: >-
    host=db;port=5432;database=${POSTGRES_DB:-xtzkt_db};username=${POSTGRES_USER:-xtzkt};password=${POSTGRES_PASSWORD:-123};
  Db__CommandTimeout: "${COMMAND_TIMEOUT:-600}"

x-defaults: &defaults
  restart: unless-stopped
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  db:
    <<: *defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xtzkt_db}
      POSTGRES_USER: ${POSTGRES_USER:-xtzkt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      start_period: 30s
      start_interval: 2s
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    <<: *defaults
    build:
      context: .
      dockerfile: Xtzkt.Api/Dockerfile
    image: xtzkt-api
    environment:
      <<: *db
      Db__CommandTimeout: "${API_COMMAND_TIMEOUT:-60}"
      Db__StatementTimeout: "${STATEMENT_TIMEOUT:-58}"
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      db:
        condition: service_healthy
      indexer-tezosx:
        condition: service_healthy
        required: false
      indexer-l1:
        condition: service_healthy
        required: false

  indexer-l1:
    profiles: ["full"]
    <<: *defaults
    build:
      context: .
      dockerfile: Xtzkt.Indexers.L1/Dockerfile
    image: xtzkt-indexer-l1
    environment:
      <<: *db
      TezosNode__Endpoint: ${L1_TEZOS_NODE:-https://rpc.tzkt.io/shadownet}
    ports:
      - "${L1_PORT:-5001}:8080"
    depends_on:
      db:
        condition: service_healthy

  indexer-tezosx:
    <<: *defaults
    build:
      context: .
      dockerfile: Xtzkt.Indexers.TezosX/Dockerfile
    image: xtzkt-indexer-tezosx
    environment:
      <<: *db
      TezosNode__Endpoint: ${TEZOSX_TEZOS_NODE:-https://michelson.previewnet.tezosx.nomadic-labs.com}
      EvmNode__Endpoint: ${TEZOSX_EVM_NODE:-https://evm.previewnet.tezosx.nomadic-labs.com}
    ports:
      - "${TEZOSX_PORT:-5002}:8080"
    depends_on:
      db:
        condition: service_healthy

  metadata:
    profiles: ["metadata", "full"]
    <<: *defaults
    build:
      context: .
      dockerfile: Xtzkt.Services.Metadata/Dockerfile
    image: xtzkt-metadata
    environment:
      <<: *db
      EvmResolver__EvmNodes__0__Url: ${METADATA_EVM_NODE:-https://evm.previewnet.tezosx.nomadic-labs.com}
      IpfsResolver__IpfsGateways__0__Url: ${METADATA_IPFS_GATEWAY:-https://ipfs.io/ipfs}
      DipDupResolver__Sources__0__Url: ${METADATA_L1_DIPDUP_URL:-https://metadata.dipdup.net/v1/graphql}
      DipDupResolver__Sources__0__IndexName: ${METADATA_L1_DIPDUP_INDEX:-metadata_shadownet}
      DipDupResolver__Sources__0__Network: ${METADATA_L1_DIPDUP_NETWORK:-shadownet}
      DipDupResolver__Sources__1__Url: ${METADATA_TEZOSX_DIPDUP_URL:-https://metadata.dipdup.net/v1/graphql}
      DipDupResolver__Sources__1__IndexName: ${METADATA_TEZOSX_DIPDUP_INDEX:-metadata_tezosx}
      DipDupResolver__Sources__1__Network: ${METADATA_TEZOSX_DIPDUP_NETWORK:-tezosx}
    ports:
      - "${METADATA_PORT:-5003}:8080"
    depends_on:
      db:
        condition: service_healthy
      indexer-tezosx:
        condition: service_healthy
        required: false
      indexer-l1:
        condition: service_healthy
        required: false

volumes:
  db-data:
