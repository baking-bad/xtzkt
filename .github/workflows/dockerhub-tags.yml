name: Dockerhub Tags

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  push_to_registry:
    name: Push ${{ matrix.image }} image to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Xtzkt.Api/Dockerfile
          - image: indexer-l1
            dockerfile: Xtzkt.Indexers.L1/Dockerfile
          - image: indexer-tezosx
            dockerfile: Xtzkt.Indexers.TezosX/Dockerfile
          - image: metadata
            dockerfile: Xtzkt.Services.Metadata/Dockerfile
    env:
      DOCKER_IMAGE_BASE: bakingbad/xtzkt
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
                 
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.DOCKER_IMAGE_BASE }}-${{ matrix.image }}:${{ env.RELEASE_VERSION }}
